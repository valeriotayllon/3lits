<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAAS | Agendamento Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="header-brand">
      <span class="brand-badge">SAAS AGENDAMENTO</span>
      <h1>Agende seu Horário</h1>
      <p>Rápido, simples e sem complicações</p>
      <div style="margin-top: 0.6rem;">
        <a href="admin.html" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 600;">Área do Profissional / Admin &rarr;</a>
      </div>
    </header>

    <form id="booking-form">
      <!-- 1. Serviço -->
      <section class="card">
        <h2 class="step-title"><span class="step-number">1</span> Escolha o Serviço</h2>
        <div class="options-grid" id="services-container"></div>
      </section>

      <!-- 2. Profissional -->
      <section class="card">
        <h2 class="step-title"><span class="step-number">2</span> Profissional</h2>
        <div class="options-grid" id="staff-container"></div>
      </section>

      <!-- 3. Data & Horário -->
      <section class="card">
        <h2 class="step-title"><span class="step-number">3</span> Data e Horário</h2>
        <div class="form-group">
          <label for="booking-date">Data:</label>
          <input type="date" id="booking-date" class="form-input" required>
        </div>
        <label style="display:block; font-size: 0.875rem; font-weight:600; margin-bottom:0.35rem;">Horários Disponíveis:</label>
        <div class="slots-grid" id="time-slots"></div>
      </section>

      <!-- 4. Dados do Cliente / Usuário -->
      <section class="card">
        <h2 class="step-title"><span class="step-number">4</span> Seus Dados</h2>
        <div class="form-group">
          <label for="client-name">Nome Completo:</label>
          <input type="text" id="client-name" class="form-input" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
          <label for="client-phone">WhatsApp / Telefone:</label>
          <input type="tel" id="client-phone" class="form-input" placeholder="(00) 00000-0000" required>
        </div>
        <div class="form-group">
          <label for="client-email">E-mail (opcional):</label>
          <input type="email" id="client-email" class="form-input" placeholder="seuemail@exemplo.com">
        </div>
        <div class="form-group">
          <label for="client-notes">Observações (opcional):</label>
          <input type="text" id="client-notes" class="form-input" placeholder="Detalhes ou preferências">
        </div>

        <button type="submit" class="btn-primary" id="btn-submit">Confirmar Agendamento</button>
      </section>
    </form>
  </div>

  <!-- Modal de Confirmação -->
  <div class="modal-overlay" id="success-modal">
    <div class="modal-content">
      <div style="font-size: 3rem; color: var(--success); margin-bottom: 0.5rem;">✔</div>
      <h3 style="margin-bottom: 0.5rem;">Agendamento Confirmado!</h3>
      <p id="modal-details" style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.25rem;"></p>
      <button class="btn-primary" onclick="window.location.reload()">Novo Agendamento</button>
    </div>
  </div>

  <!-- Biblioteca Oficial Supabase JS via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
